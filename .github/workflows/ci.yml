name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pyyaml
      - run: ruff check app tests
      - run: pytest -q tests/test_access.py

  integration-tests:
    # builds the image and runs the index tests with the real models (cached between runs)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wissensdatenbank-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/cache@v4
        with:
          path: ~/models
          key: hf-models-${{ hashFiles('app/index.py') }}
          restore-keys: hf-models-
      - name: Run integration tests
        run: |
          mkdir -p ~/models
          docker run --rm -v "$PWD/tests:/opt/tests" -v ~/models:/models -e HF_HOME=/models \
            --entrypoint python wissensdatenbank-mcp:test /opt/tests/test_index.py
      - name: Smoke test with the example vault
        run: |
          docker run -d --name wdb -p 8000:8000 -v "$PWD/examples/vault:/vault:ro" -v ~/models:/models \
            -e VAULT_DIR=/vault -e FTS_LANGUAGE=English wissensdatenbank-mcp:test
          for _ in $(seq 1 120); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 5
          done
          curl -sf http://127.0.0.1:8000/livez
          docker exec wdb wdb status
          docker exec wdb wdb eval -v
          docker exec wdb wdb account add ci --all
          docker exec wdb wdb access list
      - name: Fix model cache permissions
        if: always()
        run: sudo chown -R "$(id -u)" ~/models || true
