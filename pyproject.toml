[project]
name = "wissensdatenbank-mcp"
version = "0.1.0"
description = "MCP server for hybrid search over a Markdown/Obsidian vault in Git, with per-account access control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/test_access.py"]
